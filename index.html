<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunday Badminton">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F6B55">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>html{-webkit-text-size-adjust:100%}:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sunday Badminton</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one-column courtside phone app. Court-mat green carries every "on court" surface; ticket cream carries the draw; yellow is the single action colour. */
:root{
  --ground:#ECF1ED; --surface:#FFFFFF; --ink:#11261F; --muted:#5B6F66; --line:#D2DCD6;
  --court:#0F6B55; --court-deep:#0B5544; --court-ink:#F4FBF7; --court-line:rgba(255,255,255,.5);
  --accent:#F2B705; --accent-ink:#2A2000;
  --win:#0F7F5B; --lose:#C4432D;
  --ticket:#FFF6D6; --ticket-ink:#3A2E00;
  --gold:#E2B007; --gold-ink:#2E2300; --silver:#B9C2C9; --silver-ink:#1D262B; --bronze:#B9773F; --bronze-ink:#FFF6EC; --fire:#E8590C; --purple:#6A3FA6; --purple-ink:#FFFFFF;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Sukhumvit Set","Thonburi",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0A1411; --surface:#13221D; --ink:#E6F0EB; --muted:#8DA39A; --line:#263A31;
  --court:#127259; --court-deep:#0D5946; --court-ink:#F4FBF7; --court-line:rgba(255,255,255,.42);
  --accent:#F6C73B; --accent-ink:#2A2000;
  --win:#3CC796; --lose:#F07A63;
  --ticket:#F1E4AE; --ticket-ink:#2E2400; --gold:#F0C330; --gold-ink:#2E2300; --silver:#C9D1D7; --silver-ink:#1D262B; --bronze:#C98A54; --bronze-ink:#2A1503; --fire:#FF8A3D; --purple:#8A5FD0; --purple-ink:#FFFFFF; color-scheme:dark } }
:root[data-theme="dark"]{
  --ground:#0A1411; --surface:#13221D; --ink:#E6F0EB; --muted:#8DA39A; --line:#263A31;
  --court:#127259; --court-deep:#0D5946; --court-ink:#F4FBF7; --court-line:rgba(255,255,255,.42);
  --accent:#F6C73B; --accent-ink:#2A2000;
  --win:#3CC796; --lose:#F07A63;
  --ticket:#F1E4AE; --ticket-ink:#2E2400; --gold:#F0C330; --gold-ink:#2E2300; --silver:#C9D1D7; --silver-ink:#1D262B; --bronze:#C98A54; --bronze-ink:#2A1503; --fire:#FF8A3D; --purple:#8A5FD0; --purple-ink:#FFFFFF; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px;font-weight:700} h2{font-size:20px;font-weight:600} h3{font-size:16px;font-weight:600}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.bar-in{max-width:540px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar .name{font-family:var(--f-display);font-weight:700;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{background:none;border:0;padding:6px 0;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--win)} .sync.err i{background:var(--lose)}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}

.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:17px}
.btn.court{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.danger{color:var(--lose)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cta{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:3;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.14)}

.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:15px;background:var(--muted);border:2px solid var(--surface)}
.av.lg{width:72px;height:72px;font-size:22px} .av.sm{width:32px;height:32px;font-size:11px} .av.xl{width:96px;height:96px;font-size:28px}
.duo{display:flex} .duo .av + .av{margin-left:-12px}

/* home */
.hero{background:var(--court);color:var(--court-ink);border-radius:18px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.hero::before{content:"";position:absolute;inset:8px;border:2px solid var(--court-line);border-radius:10px;pointer-events:none}
.hero::after{content:"";position:absolute;top:8px;bottom:8px;right:34%;border-left:2px solid var(--court-line);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .label{color:var(--court-ink);opacity:.8}
.hero .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}

/* player grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pcell{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative}
.pcell span.nm{font-size:13px;font-weight:500;max-width:100%;overflow-wrap:anywhere;text-align:center;line-height:1.2}
.pcell.on{border-color:var(--court);background:color-mix(in srgb,var(--court) 12%,var(--surface))}
.pcell.on::after{content:"✓";position:absolute;top:4px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--court);color:var(--court-ink);font-size:12px;display:grid;place-items:center}
.pcell.add{border-style:dashed;justify-content:center;color:var(--muted);min-height:96px}
.pcell.pick{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}

/* tickets */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:500px){.tgrid{grid-template-columns:repeat(4,1fr)}}
.tk{aspect-ratio:4/5;border-radius:14px;border:0;position:relative;display:grid;place-items:center;padding:0;overflow:hidden}
.tk.down{background:var(--court);color:var(--court-ink)}
.tk.down::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--court-line);border-radius:6px}
.tk.down b{font-family:var(--f-display);font-size:48px;opacity:.9}
.tk.up{background:var(--ticket);color:var(--ticket-ink);border:1.5px solid color-mix(in srgb,var(--ticket-ink) 25%,transparent);}
.tk.up.new{animation:flip .35s ease-out}
.tk.up b{font-family:var(--f-display);font-size:60px;font-weight:700;line-height:1}
.tk.up.wait b{font-size:26px;letter-spacing:.04em}
.tk.up .who{position:absolute;bottom:8px;left:0;right:0;font-size:14px;font-weight:600;text-align:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.up .av{position:absolute;top:6px;left:6px;width:32px;height:32px;font-size:11px;border-width:1px}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.tk.up.new{animation:none}}

/* team rows */
.team{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left;min-width:0}
.team .tn{font-family:var(--f-display);font-weight:700;font-size:20px;width:30px;text-align:center;flex:none;color:var(--court)}
.team .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.team.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.team.wait .tn{color:var(--lose);font-size:12px;width:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);min-height:40px;font-size:14px}
.rnd{width:28px;height:28px;flex:none}
.rndb{gap:8px;padding-left:6px;border-radius:99px}
.chip.star{border-color:var(--win)}
.chip.pick{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,var(--surface));font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:8px}

/* court strip */
.court{background:var(--court);color:var(--court-ink);border:0;border-radius:16px;padding:16px 14px 20px;width:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;text-align:center}
.court::before{content:"";position:absolute;inset:7px;border:2px solid var(--court-line);border-radius:9px;pointer-events:none}
.court::after{content:"";position:absolute;top:7px;bottom:7px;left:50%;border-left:2px dashed var(--court-line);pointer-events:none}
.court > *{position:relative;z-index:1}
.court .chead{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.court .cname{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.08em;background:var(--court-deep);padding:2px 10px;border-radius:99px}
.court .clock{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;background:var(--court-deep);padding:0 10px;border-radius:8px}
.court .sides{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.court .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.court .side .nm{font-size:14px;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.court .side .tno{font-family:var(--f-display);font-size:12px;opacity:.85}
.court .vs{font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--accent);color:var(--accent-ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.court .hint{font-size:12px;opacity:.85}
.court.empty{background:transparent;color:var(--muted);border:2px dashed var(--line);min-height:96px;justify-content:center}
.court.empty::before,.court.empty::after{display:none}
.court.big .av{width:64px;height:64px;font-size:20px}

/* sheet */
.veil{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:540px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:14px}
.sheet .shead{display:flex;align-items:center;gap:10px}
.sheet .shead h2{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field select,select.sel{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:8px 12px;font-size:16px;width:100%}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slots.one{grid-template-columns:1fr}
.slots.one .slot{flex-direction:row;justify-content:center;gap:14px;padding:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 4px;background:var(--surface);cursor:pointer;font-size:13px;text-align:center}
.slot input{position:absolute;opacity:0;width:1px;height:1px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.sbox.win{border-color:var(--win)}
.sbox .nm{font-size:13px;text-align:center;overflow-wrap:anywhere;line-height:1.2}
.sbox input{width:100%;max-width:110px;text-align:center;font-family:var(--f-display);font-size:44px;font-weight:700;border:0;border-bottom:2px solid var(--line);background:transparent;padding:0;border-radius:0}
.step{display:flex;gap:6px}
.step button{width:48px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--ground);font-size:20px;font-weight:600}
.result{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.result .tag{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em}
.result .w .tag{color:var(--win)} .result .l .tag{color:var(--lose)} .result .l{opacity:.85}
.result .sc{white-space:nowrap;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

/* summary */
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hl .panel{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hl .panel:last-child{grid-column:1/-1}
.hl .val{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left;white-space:normal}
tr:last-child td{border-bottom:0}
.pname{display:flex;align-items:center;gap:8px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:40;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:99px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.empty-note{border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.court.done{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.court.done::before,.court.done::after{display:none}
.court.done .cname{background:var(--ground)}
.court.done .vs{width:auto;height:auto;border-radius:10px;padding:2px 10px;background:var(--ground);color:var(--ink);white-space:nowrap}
.court.done .side:last-child{opacity:.75}
.tag{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted);flex:none}
.tag.w{color:var(--win)} .tag.l{color:var(--lose)}
.pgc{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);grid-auto-rows:minmax(72px,1fr);gap:8px 6px;align-items:stretch;flex:1;min-height:0}
.pgc .pl{font-family:var(--f-display);font-weight:700;font-size:13px;align-self:center;white-space:nowrap}
.pgc .pv{font-family:var(--f-display);font-weight:700;font-size:13px;align-self:center;color:var(--muted)}
.pt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:6px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;text-align:left;overflow:hidden}
.pt .ph{display:flex;align-items:center;gap:8px}
.pt .nm{min-width:0;max-width:100%;overflow:hidden;font-weight:500;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.pt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,var(--surface))}
.foot{display:flex;justify-content:center;padding-top:8px;margin-top:auto}
@media (orientation:portrait),(min-height:561px){
  .v-home .hero{flex:1 1 auto;min-height:220px;justify-content:space-between;padding:28px 26px}
  .v-home .hero .big{font-size:clamp(96px,34vw,168px)}
  .v-home .hero .big+div{font-size:20px;font-family:var(--f-display);font-weight:600}
  .v-home .hero .label{font-size:14px}
  .v-home .btn.pri{min-height:84px;font-size:26px;border-radius:16px}
  .v-home .btn{min-height:56px}
  .v-home .btn.mini{min-height:36px}
  .v-home .foot{margin-top:0}
  .v-home{min-height:calc(100vh - 62px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 62px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-bottom:16px}
}
.btn.mini{min-height:36px;font-size:13px;color:var(--muted);font-weight:500}
.mrow{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.mrow .grow{flex:1;min-width:0}
.wn{font-weight:600;color:var(--win)}
.scell.rhead{background:var(--ground);border-style:dashed}
.pods{display:flex;flex-direction:column;gap:12px}
.pod{display:flex;flex-direction:column;gap:10px;padding-bottom:0;overflow:hidden}
.pod{padding-bottom:12px}
.podium{position:relative;container-type:inline-size;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;width:100%}
.podimg{position:absolute;left:0;bottom:0;width:100%;max-width:none;height:auto;pointer-events:none}
.pd{position:relative;z-index:1;padding-inline:3px}
.podium .p1{padding-bottom:calc(34.62cqw + 6px)} .podium .p2{padding-bottom:calc(24.82cqw + 6px)} .podium .p3{padding-bottom:calc(22.15cqw + 6px)}
.mdl{height:30px;width:auto;max-width:none;vertical-align:middle;flex:none}
.mdl.big{height:52px}
.rk .mdl{display:block;margin-inline:auto}
.plink .rk,.rowx .rk{flex:none;width:26px;min-width:26px;text-align:center}
.plink .chg,.rowx .chg{flex:none;display:inline-block;width:32px;text-align:center}
.pd{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;min-width:0}
.pd .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.pd .pvl{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.pd.p1 .pvl{font-size:22px}
.pd .small{white-space:nowrap}
.pstep{line-height:1;overflow:hidden;width:100%;margin-top:6px;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--court-ink)}
.p1 .pstep{height:84px;background:var(--gold);color:var(--gold-ink);font-size:36px}
.p2 .pstep{height:58px;background:var(--silver);color:var(--silver-ink)}
.p3 .pstep{height:38px;background:var(--bronze);color:var(--bronze-ink)}
button.pd,.plink,button.scell{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:inherit}
button.scell{background:var(--surface);border:1px solid var(--line);padding:4px 10px;text-align:left;align-items:stretch}
.plink{display:flex;align-items:center;gap:8px;min-width:0;min-height:36px;text-align:left}
.pd .pnr{display:flex;align-items:center;justify-content:center;gap:4px;max-width:100%;margin-top:4px}
.pd .pnr .pn{margin-top:0}
.avw{position:relative;display:inline-flex;flex:none}
.fl{width:14px;height:14px;fill:var(--fire);flex:none}

function stats(k,rid){return agg((S.days[k]||{matches:[]}).matches.filter(m=>!rid||rkey(m)===rid))}
function agg(ms){const pl={},pr={};
  const pp=id=>pl[id]||(pl[id]={id,g:0,w:0,t:0,pf:0,pa:0});
  ms.forEach(m=>{[['a','b',m.sa,m.sb],['b','a',m.sb,m.sa]].forEach(([me,,f,ag])=>{const ids=m[me],won=m.w===me;
      ids.forEach(id=>{const x=pp(id);x.g++;x.t+=m.dur||0;x.pf+=f;x.pa+=ag;if(won)x.w++});
      const key=[...ids].sort().join('|'),x=pr[key]||(pr[key]={ids:[...ids].sort(),g:0,w:0,pf:0,pa:0});x.g++;x.pf+=f;x.pa+=ag;if(won)x.w++})});
  const players=Object.values(pl).sort((a,b)=>b.w-a.w||b.w/b.g-a.w/a.g||(b.pf-b.pa)-(a.pf-a.pa));
  const pairs=Object.values(pr).sort((a,b)=>b.w-a.w||b.w/b.g-a.w/a.g||(b.pf-b.pa)-(a.pf-a.pa));
  return {ms,players,pairs,byTime:[...players].sort((a,b)=>b.t-a.t)}}
let sTab='hl',sPage=0,rDay='',rPage=0,bPage=0,profId='',profBack='home';
function career(){const keys=Object.keys(S.days).filter(k=>S.days[k].matches.length).sort(),all=keys.flatMap(k=>S.days[k].matches);
  const cur=agg(all),prev=keys.length>1?agg(keys.slice(0,-1).flatMap(k=>S.days[k].matches)):null,rank={},prank={},streak={};
  cur.players.forEach((x,i)=>{rank[x.id]=i+1});if(prev)prev.players.forEach((x,i)=>{prank[x.id]=i+1});
  const att=keys.map(k=>{const st=new Set();S.days[k].matches.forEach(m=>m.a.concat(m.b).forEach(id=>st.add(id)));return st});
  cur.players.forEach(x=>{let n=0;for(let i=att.length-1;i>=0&&att[i].has(x.id);i--)n++;streak[x.id]=n});

const medal=(r,cls)=>'<img class="mdl '+(cls||'')+'" src="'+MED[r]+'" alt="อันดับ '+r+'" title="อันดับ '+r+'">';
const rkc=r=>r<=3?'<span class="rk">'+medal(r)+'</span>':'<b class="rk">'+r+'</b>';
const FL='<svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2c.6 3.600 4.500 5.400 4.500 10.500a5.500 5.500 0 0 1-11 0c0-2.200 1-3.800 2.300-5 .1 2 .9 3.200 2 3.500C10.500 8 10.800 5 13 2z"/></svg>';
const fire=n=>n>=2?'<span class="fire" title="มาติดต่อกัน '+n+' ครั้ง">'+FL+n+'</span>':'';
const avb=(id,kind,cls,n)=>'<span class="avw">'+av(id,kind,cls)+(n>=2?'<span class="fbadge" title="มาติดต่อกัน '+n+' ครั้ง">'+FL+n+'</span>':'')+'</span>';
function chg(c,id){if(!c.hasPrev)return '';const p=c.prank[id];if(!p)return '<span class="chg new">ใหม่</span>';const d=p-c.rank[id];
  return d>0?'<span class="chg up" title="ขึ้น '+d+' อันดับ">▲'+d+'</span>':d<0?'<span class="chg down" title="ลง '+(-d)+' อันดับ">▼'+(-d)+'</span>':'<span class="chg same" title="อันดับเท่าเดิม">=</span>'}
function podium(title,list,kind,val,sub,c){const cell=(x,i)=>x?'<button class="pd p'+(i+1)+'" data-a="openProfile" data-id="'+esc(x.id)+'">'+(c?avb(x.id,kind,i===0?'lg':'',c.streak[x.id]):av(x.id,i===0?kind:'photo',i===0?'lg':''))+
    '<span class="pnr"><b class="pn">'+esc(pname(x.id))+'</b>'+(c?chg(c,x.id):'')+'</span><span class="pvl num">'+val(x)+'</span><span class="small muted">'+sub(x)+'</span></button>':'<div class="pd"></div>';
  return '<section class="panel pod"><div class="label">'+title+'</div><div class="podium">'+cell(list[1],1)+cell(list[0],0)+cell(list[2],2)+'<img class="podimg" src="'+POD+'" alt=""></div></section>'}
const pager=(act,page,pages)=>pages>1?'<div class="pager"><button class="btn" data-a="'+act+'" data-d="-1"'+(page<=0?' disabled':'')+' aria-label="หน้าก่อน">‹</button><span class="num">'+(page+1)+'/'+pages+'</span><button class="btn" data-a="'+act+'" data-d="1"'+(page>=pages-1?' disabled':'')+' aria-label="หน้าถัดไป">›</button></div>':'';
function vBoard(){const c=career(),ps=c.cur.players;
  if(!ps.length)return {title:'SCOREBOARD',main:T('SCOREBOARD')+'<div class="empty-note">ยังไม่มีคะแนนสะสม เมื่อบันทึกผล match แรก อันดับจะขึ้นที่นี่</div>'};
  const pod=podium('ชนะมากที่สุด · สะสม',ps,'photo',x=>x.w+' ชนะ',x=>'จาก '+x.g+' match',c);
  const info='สะสม '+c.keys.length+' ครั้ง · '+c.all.length+' match'+(c.hasPrev?' · ลูกศรเทียบกับอันดับก่อนครั้งล่าสุด':'');
  if(LAND){const cap=10,pages=Math.max(1,Math.ceil(ps.length/cap));bPage=Math.max(0,Math.min(pages-1,bPage));
    return {title:'SCOREBOARD',main:'<div class="split"><div class="pods bpod">'+pod+'</div><div class="fit" data-fit="2.7">'+ps.slice(bPage*cap,(bPage+1)*cap).map(x=>
      '<button class="scell" data-a="openProfile" data-id="'+esc(x.id)+'"><span class="rowx">'+rkc(c.rank[x.id])+chg(c,x.id)+'<b class="grow">'+esc(pname(x.id))+'</b>'+fire(c.streak[x.id])+'</span><span class="muted num">'+x.w+' ชนะ · '+(x.g-x.w)+' แพ้</span></button>').join('')+'</div></div>',
      acts:'<div class="small muted">'+info+'</div>'+pager('bPg',bPage,pages)}}
  return {main:'<h1>SCOREBOARD</h1><p class="small muted">'+info+'</p><div class="pods">'+pod+'</div>'+
    '<div class="tbl-wrap"><table class="tight"><thead><tr><th>อันดับ · ผู้เล่น</th><th>match</th><th>ชนะ</th><th>แพ้</th><th>ในสนาม</th></tr></thead><tbody>'+
    ps.map(x=>'<tr><td><button class="plink" data-a="openProfile" data-id="'+esc(x.id)+'">'+rkc(c.rank[x.id])+chg(c,x.id)+av(x.id,'photo','sm')+'<span>'+esc(pname(x.id))+'</span>'+fire(c.streak[x.id])+'</button></td><td>'+x.g+'</td><td>'+x.w+'</td><td>'+(x.g-x.w)+'</td><td>'+hm(x.t)+'</td></tr>').join('')+'</tbody></table></div>'}}
const hm=ms=>{const m=Math.round(ms/60000);return Math.floor(m/60)+':'+pad(m%60)+' ชม.'};
function vProfile(){const c=career(),id=profId,x=c.cur.players.find(p=>p.id===id)||{g:0,w:0,t:0},rank=c.rank[id],n=c.streak[id]||0;
  const mates=c.cur.pairs.filter(p=>p.ids.includes(id)).map(p=>({id:p.ids.find(q=>q!==id),g:p.g,w:p.w,l:p.g-p.w}));
  const up=mates.filter(m=>m.w>0).sort((a,b)=>b.w-a.w||b.w/b.g-a.w/a.g)[0],dn=mates.filter(m=>m.l>0).sort((a,b)=>b.l-a.l||a.w/a.g-b.w/b.g)[0];
  const mate=(title,m,txt)=>'<section class="panel pstat"><div class="label">'+title+'</div>'+(m?'<button class="plink" data-a="openProfile" data-id="'+esc(m.id)+'">'+av(m.id,'photo','')+'<span><b>'+esc(pname(m.id))+'</b><br><span class="small muted">'+txt(m)+'</span></span></button>':'<div class="small muted">ยังไม่มีข้อมูล</div>')+'</section>';
  const head='<div class="prof">'+avb(id,'photo','xl',n)+'<h1>'+esc(pname(id))+(rank&&rank<=3?medal(rank,'big'):'')+'</h1><div class="mtally" title="จำนวนครั้งที่จบวันด้วยอันดับ 1 2 3">'+[1,2,3].map(r=>{const k=(c.tally[id]||[0,0,0])[r-1];return '<span class="mt'+(k?'':' zero')+'">'+medal(r)+'<b class="num">×'+k+'</b></span>'}).join('')+'</div></div>';

  rPg(d){rPage+=+d.d;render()},
  delRound(d){const day=S.days[d.day];if(!day)return;const out=day.matches.filter(m=>rkey(m)===d.r);if(!out.length)return;
    day.matches=day.matches.filter(m=>rkey(m)!==d.r);day.gone=(day.gone||[]).concat(out.map(m=>m.id));saveDay(d.day);toast('ลบ '+out.length+' match ของ round นี้แล้ว');render()},
  wipeAll(){Object.keys(S.days).forEach(k=>{const day=S.days[k];if(!day.matches.length)return;day.gone=(day.gone||[]).concat(day.matches.map(m=>m.id));day.matches=[];saveDay(k)});
    if(S.session){S.session=null;saveSession()}toast('ลบข้อมูลการแข่งทั้งหมดแล้ว');render()}
};
const armed=new WeakMap();
const ADMIN=new Set(['delMatch','delRound','wipeAll','delPlayer','setCode','openReset']);let pendingA='';
document.addEventListener('click',e=>{
  if(e.target.id==='veil'){closeSheet();return}
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(!unlocked&&ADMIN.has(el.dataset.a)){pendingA=el.dataset.a;e.preventDefault();codeMode='enter';codeErr='';openSheet('code');return}
  if(el.dataset.confirm&&!armed.has(el)){armed.set(el,el.innerHTML);const c=el.dataset.confirm;el.textContent=c==='1'?'แตะอีกครั้งเพื่อยืนยัน':c;el.classList.add('armed');
    setTimeout(()=>{if(armed.has(el)){el.innerHTML=armed.get(el);armed.delete(el);el.classList.remove('armed')}},3000);return}
  armed.delete(el);
  const f=A[el.dataset.a];if(f)f(el.dataset,el)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.input;
  if(k==='pName'&&draft)draft.name=t.value;
  if(k==='score'&&fin){fin[t.dataset.k]=Math.max(0,Math.min(99,parseInt(t.value,10)||0));refreshFin()}});
document.addEventListener('change',async e=>{const t=e.target,k=t.dataset.change;
  if(k==='sumDay'){sumDay=t.value;sumRound='';render()}
  if(k==='sumRound'){sumRound=t.value;render()}
  if(k==='rDay'){rDay=t.value;rPage=0;render()}
  if(k==='import'&&t.files&&t.files[0]){if(!unlocked){codeMode='enter';codeErr='';openSheet('code');return}
    try{importData(JSON.parse(await t.files[0].text()))}catch(err){toast('ไฟล์นี้อ่านไม่ได้ ต้องเป็นไฟล์สำรองของแอปนี้')}t.value=''}
  if(k==='photo'&&draft&&t.files&&t.files[0]){try{draft[t.dataset.k]=await shrink(t.files[0]);renderSheet()}catch(err){toast('เปิดรูปนี้ไม่ได้ ลองรูปอื่น')}}});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.input==='score')e.target.select()});
setInterval(()=>{document.querySelectorAll('[data-start]').forEach(el=>{el.textContent=clock(Date.now()-(+el.dataset.start))})},1000);

/* keep the screen on while courts are running */
let lock=null;async function wake(){const need=view==='play';try{if(need&&!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}else if(!need&&lock){await lock.release();lock=null}}catch(e){lock=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

const relayout=()=>{const was=LAND;LAND=mqL.matches;if(was!==LAND)render();else fitAll()};
if(mqL.addEventListener)mqL.addEventListener('change',relayout);else if(mqL.addListener)mqL.addListener(relayout);
window.addEventListener('resize',relayout);
loadLocal();setSync('wait');render();connect();
})();
</script>
